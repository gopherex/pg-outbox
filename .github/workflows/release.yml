name: Release

# Root tags use vX.Y.Z. Contrib module tags use path-prefixed tags such as
# contrib/publishers/nats/vX.Y.Z.
on:
  push:
    tags:
      - "v*"
      - "contrib/**/v*"

permissions:
  contents: read

jobs:
  # Releases must build green: run the full CI suite first.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
